name: prep2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "rembg[cpu]" onnxruntime pillow && python prep2.py 2>&1 | tee cut_log.txt
      - if: always()
        run: git config user.name gh && git config user.email a@b.c && git add cutouts cut_log.txt && git commit -m cut && git pull --rebase -q && git push
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scout2.py 2>&1 | tee scout_log.txt
      - if: always()
        run: git config user.name gh && git config user.email a@b.c && git add scout2.txt scout_log.txt && git commit -m scout && git pull --rebase -q && git push
