name: make-videos
on:
  workflow_dispatch:
  push:
    paths: ['render_request.txt']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q edge-tts pillow
      - run: python make_videos.py $(cat render_request.txt)
      - run: |
          mkdir -p rendered2 && cp videos/*.mp4 rendered2/
          git config user.name github-actions && git config user.email actions@github.com
          git add rendered2 && git commit -m "Rendered videos" && git push
