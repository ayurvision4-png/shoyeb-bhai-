name: prep2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo skip
      - if: always()
        run: git config user.name gh && git config user.email a@b.c && git add cutouts cut_log.txt && git commit -m cut && git pull --rebase -q && git push
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scout2.py > scout_log.txt 2>&1 || true
      - if: always()
        run: git config user.name gh && git config user.email a@b.c && git add -A scout_log.txt; git add scout2.txt || true && git commit -m scout && git pull --rebase -q && git push
