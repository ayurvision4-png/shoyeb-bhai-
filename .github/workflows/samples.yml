name: anime-samples
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - run: python tools/gen_samples.py ${{ matrix.n }} out
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: s${{ matrix.n }}
          path: out
          if-no-files-found: ignore
