name: anime-samples
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python tools/gen_samples.py samples/anime
      - if: always()
        run: |
          git config user.name github-actions && git config user.email actions@github.com
          git add samples && git commit -m "Anime samples" && git pull --rebase -q && git push
