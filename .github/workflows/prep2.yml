name: prep2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "rembg[cpu]" onnxruntime pillow && python prep2.py && python scout2.py
      - run: git config user.name gh && git config user.email a@b.c && git add cutouts scout2.txt && git commit -m prep2 && git pull --rebase -q && git push
